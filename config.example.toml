# wisen configuration — copy to ~/.wisen/config.toml
# Environment variables (in parentheses) always override these values.

[model]
# Synthesis model (WISEN_SYNTH_MODEL). The nightly synthesis is the big token
# spend. Already have a Claude Pro/Max subscription? wisen runs it there at no
# extra cost, via the Claude Code CLI: `claude` installed and logged in
# (`claude auth status`). wisen leaves ANTHROPIC_API_KEY out of the CLI's
# environment, so a key in your shell never moves it to API billing.
# synth_model = "claude-cli:sonnet"   # the default; or claude-cli:opus
# Prefer an API key? Synthesize on the API chat model below instead (`model`
# must then be an API model, not claude-sdk:*):
# synth_model = "api"

# The model for chat and the Gardener (WISEN_MODEL). Unset, they run on your
# Claude subscription through the Claude Agent SDK (claude-sdk:sonnet), which
# drives the same logged-in `claude` CLI. If OPENAI_API_KEY is set, the
# default is openai:gpt-5.6-terra instead. It is your own subscription, on your
# own server or machine, over your own history. Anthropic's policy on claude.ai
# login in Agent SDK products: https://code.claude.com/docs/en/agent-sdk/overview
# An API key is the alternative: a pydantic-ai model string plus its key.
# openai:* needs OPENAI_API_KEY, deepseek:* needs DEEPSEEK_API_KEY,
# google:* needs GEMINI_API_KEY (or GOOGLE_API_KEY),
# anthropic:* needs ANTHROPIC_API_KEY.
# With neither that key nor a logged-in CLI, the synthesis still saves its
# reflection, and the Gardener and chat skip with one line saying what to set.
# Examples:
#   claude-sdk:opus · deepseek:deepseek-v4-flash · google:gemini-2.5-flash · anthropic:claude-sonnet-5
# model = "claude-sdk:sonnet"

[storage]
sqlite_path = "~/.wisen/wisen.db"           # (WISEN_DB_PATH) created on first use
user_id = "local"                           # (WISEN_USER_ID) owner of every stored row and outbound packet
# Only read by the one-off `wisen migrate-mongo` (pre-SQLite installs):
# mongodb_uri = "mongodb://127.0.0.1:27017" # (MONGODB_URI)
# mongodb_db = "wisen"                      # (MONGODB_DB)

[paths]
# Where `wisen export` writes reflection JSON files (WISEN_EXPORT_DIR)
export_dir = "~/.wisen/exports/reflections"

# Egress log: one line per packet that passed the egress gate — hash, size and
# field names, never content (WISEN_EGRESS_LOG). `wisen egress` reads it.
egress_log = "~/.wisen/egress.log"

# Base dir containing the agents' dot-dirs — .claude, .codex, .gemini,
# .cursor, .config/opencode (WISEN_ROOT_DIR). Point it at a synced copy of
# another machine's dotfiles to run wisen against that machine's history.
root_dir = "~"

# Comma-separated dirs scanned for git repos and their harness files
# (CLAUDE.md, AGENTS.md, …). Entries may be parent dirs or specific repo
# paths (GIT_SCAN_DIRS).
git_scan_dirs = "~/Developer"

[gardener]
# Your git email: only your commits count as problems solved (WISEN_OWNER_EMAIL).
# Default: each repo's `git config user.email`.
# owner_email = "you@example.com"

[cloud]
# Stage B with a paired server (WISEN_CLOUD_STAGE): "b" sends the Observer's
# notes on each day and the current text of the files the Gardener may edit
# (secret-redacted) to your server, which then writes the reflection and the
# proposals while this laptop sleeps. Turn the server to stage B first.
# Default "a": the laptop synthesizes and sends only the results.
# stage = "b"
