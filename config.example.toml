# wisen configuration — copy to ~/.wisen/config.toml
# Environment variables (in parentheses) always override these values.

[model]
# pydantic-ai model string for chat (WISEN_MODEL)
# openai:* needs OPENAI_API_KEY, deepseek:* needs DEEPSEEK_API_KEY,
# google:* needs GEMINI_API_KEY, anthropic:* needs ANTHROPIC_API_KEY.
# Any other pydantic-ai provider works the same way. Examples:
#   deepseek:deepseek-v4-flash · google:gemini-2.5-flash · anthropic:claude-sonnet-5
model = "openai:gpt-5.6-terra"

# Synthesis model (WISEN_SYNTH_MODEL). Defaults to claude-cli:claude-sonnet-5 —
# the Claude Code CLI on a Claude Pro/Max subscription, no API billing
# (requires `claude` installed and logged in). Set to any non claude-cli
# value (e.g. "api") to run synthesis on `model` above instead.
# synth_model = "claude-cli:claude-sonnet-5"

[storage]
mongodb_uri = "mongodb://127.0.0.1:27017"   # (MONGODB_URI)
mongodb_db = "wisen"                        # (MONGODB_DB)

[paths]
# Where `wisen export` writes reflection JSON files (WISEN_EXPORT_DIR)
export_dir = "~/.wisen/exports/reflections"

# Base dir containing the agents' dot-dirs — .claude, .codex, .gemini,
# .cursor, .config/opencode (WISEN_ROOT_DIR). Point it at a synced copy of
# another machine's dotfiles to run wisen against that machine's history.
root_dir = "~"

# Comma-separated dirs scanned for git repos and their harness files
# (CLAUDE.md, AGENTS.md, …). Entries may be parent dirs or specific repo
# paths (GIT_SCAN_DIRS).
git_scan_dirs = "~/Developer"
