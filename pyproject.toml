[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wisen"
version = "0.1.0"
description = "A continuous-learning harness for coding agents: it learns from your real agent sessions with a private daily reflection, a chat you can ask about your work, and instruction files that keep improving as your agents work"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["coding-agents", "claude-code", "codex", "llm", "reflection", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.12",
    "pydantic-ai[google,openai,anthropic]>=2.57.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "certifi>=2024.0.0"]
cloud = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pywebpush>=2.0", "cryptography>=42"]
voice = ["livekit-agents[google]~=1.5", "livekit>=0.17"]
dev = ["pytest>=8.0", "ruff>=0.5", "pre-commit>=3.0"]
migrate = ["pymongo>=4.6"]

[project.scripts]
wisen = "wisen.cli:main"

[project.urls]
Homepage = "https://github.com/Vela3202019/wisen"
Repository = "https://github.com/Vela3202019/wisen"
Issues = "https://github.com/Vela3202019/wisen/issues"
Changelog = "https://github.com/Vela3202019/wisen/releases"

[tool.ruff.lint]
ignore = ["E731", "E741"]

[tool.setuptools.packages.find]
include = ["wisen*"]

[tool.setuptools.package-data]
"wisen.dashboard" = ["*.html", "*.js", "*.webmanifest", "*.svg", "*.png"]
