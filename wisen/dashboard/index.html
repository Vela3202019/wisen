<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hi boss</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
          --aligned:#3fb950; --mild:#d29922; --friction:#f0883e; --misaligned:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .trigger { display:flex; gap:8px; margin-bottom:20px; }
  .trigger input { flex:1; background:var(--card); border:1px solid var(--border);
                   color:var(--text); border-radius:8px; padding:10px; font-size:15px; }
  .trigger button { background:#238636; color:#fff; border:0; border-radius:8px;
                    padding:10px 18px; font-size:15px; }
  .queued { color:var(--dim); font-size:13px; margin:-12px 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          padding:14px 16px; margin-bottom:12px; cursor:pointer; }
  .card .head { display:flex; justify-content:space-between; align-items:center; }
  .card .date { font-weight:600; font-size:16px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:10px; color:#0d1117; font-weight:600; }
  .bar { height:6px; background:var(--border); border-radius:3px; margin:10px 0 6px; }
  .bar > div { height:6px; border-radius:3px; }
  .moods { color:var(--dim); font-size:13px; margin-top:6px; }
  .question { font-size:15px; font-style:italic; margin:10px 0 4px;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.open .question { -webkit-line-clamp:unset; }
  .mood-line { color:var(--dim); font-size:13px; margin:6px 0; }
  .mood-line b { color:var(--text); font-style:normal; }
  .insight { font-size:14px; margin:8px 0 2px; padding:8px 10px; background:var(--bg);
             border-left:3px solid var(--mild); border-radius:0 8px 8px 0;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.open .insight { -webkit-line-clamp:unset; }
  .detail { display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .card.open .detail { display:block; }
  .card.min .question, .card.min .mood-line, .card.min .insight, .card.min .detail { display:none; }
  .detail h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
               color:var(--dim); margin:14px 0 6px; }
  .detail p, .detail li { font-size:14px; margin:4px 0; }
  .detail ul { margin:4px 0; padding-left:18px; }
  .topic { display:inline-block; background:var(--bg); border:1px solid var(--border);
           border-radius:12px; padding:2px 10px; margin:2px 4px 2px 0; font-size:13px; }
  .topic.new { border-color:var(--aligned); }
  .rec b { color:var(--mild); }
  .empty { color:var(--dim); text-align:center; margin-top:40px; }
  .usage { background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:12px 16px; margin-bottom:16px; }
  .usage h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--dim); margin:0 0 8px; display:flex; justify-content:space-between; }
  .usage h2 button { background:none; border:0; color:var(--dim); font-size:14px;
                     cursor:pointer; padding:0; }
  .urow { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; }
  .urow .name { width:110px; color:var(--text); }
  .urow .bar { flex:1; margin:0; }
  .urow .pct { width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .usage .asof { color:var(--dim); font-size:11px; margin-top:6px; }
  .chart { background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:12px 16px; margin-bottom:16px; }
  .chart h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--dim); margin:0 0 8px; }
  .chart .tip { font-size:12px; color:var(--dim); height:16px; margin-top:4px; }
  .chart svg { display:block; width:100%; height:auto; }
  .hero { background:linear-gradient(180deg, #1a2230, var(--card)); border:1px solid var(--border);
          border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .hero .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .hero .date { font-weight:600; font-size:16px; }
  .hero .stats { display:flex; gap:8px; margin:4px 0 12px; }
  .hero .stat { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px;
                padding:8px 6px; text-align:center; }
  .hero .stat .big { font-size:22px; font-weight:700; line-height:1.2; }
  .hero .stat .lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .hero .tldr { list-style:none; margin:0 0 4px; padding:0; }
  .hero .tldr li { font-size:16px; margin:8px 0; line-height:1.4; }
  .hero .more { color:var(--dim); font-size:13px; cursor:pointer; margin-top:10px;
                background:none; border:0; padding:0; }
  .hero .brief { display:none; }
  .hero .brief.show { display:block; }
  .hero .brief p { font-size:14.5px; margin:8px 0; color:var(--dim); }
  .hero .experiment { margin-top:12px; padding:10px 12px; background:var(--bg);
                      border-left:3px solid var(--aligned); border-radius:0 8px 8px 0; font-size:14px; }
  .hero .experiment b { color:var(--aligned); }
  .hero .carry { margin-top:10px; font-size:14px; font-style:italic; color:var(--text); }
  .hero .carry span { color:var(--dim); font-style:normal; font-size:12px; text-transform:uppercase;
                      letter-spacing:.05em; display:block; margin-bottom:2px; }
  .loop { background:var(--card); border:1px solid var(--border); border-radius:12px;
          padding:12px 16px; margin-bottom:16px; }
  .loop h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--dim); margin:0 0 8px; display:flex; justify-content:space-between; }
  .loop .rate { font-variant-numeric:tabular-nums; }
  .loop ul { margin:4px 0; padding-left:4px; list-style:none; }
  .loop li { font-size:13.5px; margin:5px 0; }
  .loop .ok { color:var(--aligned); }
  .loop .miss { color:var(--misaligned); }
  .loop .persist { color:var(--friction); }
  .loop .resolved { color:var(--aligned); }
  .loop .days { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🫡 hi boss</h1>
  <div class="usage" id="usage" style="display:none"></div>
  <div class="chart" id="chart" style="display:none"></div>
  <div class="hero" id="hero" style="display:none"></div>
  <div class="loop" id="loop" style="display:none"></div>
  <div class="trigger">
    <input type="date" id="date">
    <button onclick="trigger()">Reflect</button>
  </div>
  <div class="queued" id="queued"></div>
  <div id="logs"><p class="empty">Loading…</p></div>
</div>
<script>
const COLORS = { "aligned":"var(--aligned)", "mild-friction":"var(--mild)",
                 "friction":"var(--friction)", "misaligned":"var(--misaligned)" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Clamp old long-form docs to the new limits: max 3 paragraphs, ~60 words each.
function briefParas(text) {
  return String(text || "").split(/\n\n+/).slice(0, 3).map(p => {
    const words = p.split(/\s+/);
    return `<p>${esc(words.length > 60 ? words.slice(0, 60).join(" ") + " …" : p)}</p>`;
  }).join("");
}

function usageColor(p) {
  return p >= 90 ? "var(--misaligned)" : p >= 70 ? "var(--friction)"
       : p >= 50 ? "var(--mild)" : "var(--aligned)";
}

function usageRow(name, pct, resetsAt) {
  if (pct == null) return "";
  const reset = resetsAt ? new Date(resetsAt).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}) : "";
  return `<div class="urow"><span class="name">${name}</span>
    <div class="bar"><div style="width:${Math.min(pct,100)}%;background:${usageColor(pct)}"></div></div>
    <span class="pct">${Math.round(pct)}%</span>
    <span style="color:var(--dim)">resets ${reset}</span></div>`;
}

function renderUsage(u) {
  const el = document.getElementById("usage");
  if (!u || (!u.claude && !u.codex)) return;
  let rows = "";
  if (u.claude) rows += usageRow("Claude 5h", u.claude.five_hour_pct, u.claude.five_hour_resets_at)
                      + usageRow("Claude week", u.claude.seven_day_pct, u.claude.seven_day_resets_at);
  if (u.codex)  rows += usageRow("Codex 5h", u.codex.five_hour_pct, u.codex.five_hour_resets_at)
                      + usageRow("Codex week", u.codex.weekly_pct, u.codex.weekly_resets_at);
  el.innerHTML = `<h2>Subscription usage <button onclick="load()" title="Refresh">↻ refresh</button></h2>${rows}
    <div class="asof">updated ${new Date(u.collected_at).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})} · checked ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"})}</div>`;
  el.style.display = "block";
}

// Morning brief: big numbers + 3 bullets + today's experiment. Long text behind "read more".
function renderHero(logs) {
  const el = document.getElementById("hero");
  const l = logs[0];
  if (!l || !l.synthesis_context) { el.style.display = "none"; return; }
  const c = COLORS[l.alignment_label] || "var(--dim)";
  const pct = Math.round((l.alignment_score || 0) * 100);
  const prev = logs[1] ? Math.round((logs[1].alignment_score || 0) * 100) : null;
  const arrow = prev == null ? "" : pct > prev ? " ↑" : pct < prev ? " ↓" : " →";
  const persisting = (l.friction_deltas || []).filter(d => d.status === "persisting").length
                   + (l.friction_deltas || []).filter(d => d.status === "new").length;
  const moodEmoji = MOOD_EMOJI[l.your_mood?.label] || "💭";
  const stats = `<div class="stats">
    <div class="stat"><div class="big" style="color:${c}">${pct}%${arrow}</div><div class="lbl">align</div></div>
    <div class="stat"><div class="big">${moodEmoji}</div><div class="lbl">${esc(l.your_mood?.label || "mood")}</div></div>
    <div class="stat"><div class="big" style="color:${persisting ? "var(--friction)" : "var(--aligned)"}">${persisting}</div><div class="lbl">friction</div></div>
  </div>`;
  // tldr from synthesis; fall back to insight for old docs
  const bullets = (l.tldr && l.tldr.length ? l.tldr : [l.insight].filter(Boolean))
    .map(b => `<li>${esc(b)}</li>`).join("");
  const paras = briefParas(l.synthesis_context);
  const exp = (l.recommendations || [])[0];
  const experiment = exp
    ? `<div class="experiment"><b>🎯 Today</b><br>${esc(exp.action)}</div>` : "";
  el.innerHTML = `<div class="head">
      <span class="date">☀️ ${esc(l.date)}</span>
      <span class="badge" style="background:${c}">${esc(l.alignment_label)}</span>
    </div>
    ${stats}
    <ul class="tldr">${bullets}</ul>
    ${experiment}
    <button class="more" onclick="this.nextElementSibling.classList.toggle('show');this.textContent=this.textContent.startsWith('▸')?'▾ hide':'▸ read more'">▸ read more</button>
    <div class="brief">${paras}
      ${l.your_question?.question ? `<p>💭 <i>${esc(l.your_question.question)}</i></p>` : ""}</div>`;
  el.style.display = "block";
}

// Learning loop: did yesterday's advice land, and what friction refuses to die?
function renderLoop(logs) {
  const el = document.getElementById("loop");
  const l = logs[0];
  if (!l) { el.style.display = "none"; return; }
  const acted = l.acted_on_recommendations || [];
  const ignored = l.ignored_recommendations || [];
  const deltas = (l.friction_deltas || []).filter(d => d.status !== "new");
  if (!acted.length && !ignored.length && !deltas.length) { el.style.display = "none"; return; }

  // Follow-through rate — only days that tracked ignored recs, else misses are invisible.
  let done = 0, total = 0;
  for (const d of logs) {
    if (!Array.isArray(d.ignored_recommendations)) continue;
    const a = (d.acted_on_recommendations || []).length;
    const i = d.ignored_recommendations.length;
    done += a; total += a + i;
  }
  const rate = total ? `<span class="rate">follow-through ${Math.round(done / total * 100)}%</span>` : "";

  const items =
    acted.map(a => `<li class="ok">✓ ${esc(a)}</li>`).join("") +
    ignored.map(i => `<li class="miss">✗ ${esc(i)}</li>`).join("") +
    deltas.map(d => d.status === "persisting"
      ? `<li class="persist">↻ ${esc(d.description)} <span class="days">· ${d.days_persisting || "?"}d</span></li>`
      : `<li class="resolved">✦ resolved — ${esc(d.description)}</li>`).join("");
  el.innerHTML = `<h2>Learning loop ${rate}</h2><ul>${items}</ul>`;
  el.style.display = "block";
}

function renderChart(logs) {
  const el = document.getElementById("chart");
  const days = [...logs].filter(l => l.date).sort((a, b) => a.date < b.date ? -1 : 1);
  if (days.length < 2) { el.style.display = "none"; return; }

  const W = 688, H = 150, PAD = { l: 30, r: 8, t: 12, b: 22 };
  const w = W - PAD.l - PAD.r, h = H - PAD.t - PAD.b;
  const x = i => PAD.l + (days.length === 1 ? w / 2 : i * w / (days.length - 1));
  const y = score => PAD.t + (1 - (score ?? 0)) * h;

  let out = "";
  // gridlines + y labels (0 / 50 / 100%)
  for (const v of [0, 0.5, 1]) {
    out += `<line x1="${PAD.l}" y1="${y(v)}" x2="${W - PAD.r}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"${v ? "" : ' stroke-dasharray="3 3"'}/>
            <text x="${PAD.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--dim)">${v * 100}</text>`;
  }
  // area + line
  const pts = days.map((d, i) => [x(i), y(d.alignment_score)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  out += `<path d="${line} L ${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L ${pts[0][0].toFixed(1)} ${y(0)} Z" fill="var(--aligned)" opacity="0.08"/>
          <path d="${line}" fill="none" stroke="var(--dim)" stroke-width="1.5"/>`;
  // x labels: first, middle, last
  const labelIdx = [...new Set([0, Math.floor((days.length - 1) / 2), days.length - 1])];
  for (const i of labelIdx)
    out += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--dim)">${esc(days[i].date.slice(5))}</text>`;
  // crosshair (hidden until hover)
  out += `<line id="crosshair" y1="${PAD.t}" y2="${H - PAD.b}" stroke="var(--dim)"
          stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  // dots (colored by alignment label)
  days.forEach((d, i) => {
    const c = COLORS[d.alignment_label] || "var(--dim)";
    out += `<circle cx="${x(i)}" cy="${y(d.alignment_score)}" r="3.5" fill="${c}"/>`;
  });
  // full-width hover capture layer
  out += `<rect id="hoverzone" x="${PAD.l}" y="${PAD.t}" width="${w}" height="${h}" fill="transparent"/>`;

  el.innerHTML = `<h2>Alignment over time</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alignment score over time">${out}</svg>
    <div class="tip" id="chart-tip">dot = day · hover for details</div>`;
  el.style.display = "block";

  const svg = el.querySelector("svg");
  const cross = el.querySelector("#crosshair");
  const tip = el.querySelector("#chart-tip");
  const defaultTip = tip.textContent;

  el.querySelector("#hoverzone").addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(days.length - 1, Math.round((mx - PAD.l) / (w / (days.length - 1)))));
    const d = days[i], n = (d.friction_points || []).length;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("visibility", "visible");
    tip.textContent = `${d.date} — ${Math.round((d.alignment_score || 0) * 100)}% ${d.alignment_label}${n ? ` · ${n} friction point${n > 1 ? "s" : ""}` : ""}`;
  });
  el.querySelector("#hoverzone").addEventListener("mouseleave", () => {
    cross.setAttribute("visibility", "hidden");
    tip.textContent = defaultTip;
  });
}

async function load() {
  const [logs, queue, usage] = await Promise.all([
    fetch("/api/logs").then(r => r.json()),
    fetch("/api/queue").then(r => r.json()),
    fetch("/api/usage").then(r => r.json()).catch(() => null),
  ]);
  renderUsage(usage);
  renderHero(logs);
  renderLoop(logs);
  renderChart(logs);
  document.getElementById("queued").textContent =
    queue.length ? "Queued for reflection (runs when laptop is awake): " + queue.join(", ") : "";
  const el = document.getElementById("logs");
  if (!logs.length) { el.innerHTML = '<p class="empty">No reflections yet.</p>'; return; }
  el.innerHTML = logs.map(render).join("");
}

const MOOD_EMOJI = { "deep-focus":"🎯", "exploratory":"🧭", "frustrated":"😤", "iterating":"🔁",
                     "uncertain":"🤔", "confident":"😎", "stuck":"🧱", "flowing":"🌊" };

function render(l) {
  const c = COLORS[l.alignment_label] || "var(--dim)";
  const pct = Math.round((l.alignment_score || 0) * 100);
  const insight = l.insight || (l.recommendations || [])[0]?.action || "";
  const moodEmoji = MOOD_EMOJI[l.your_mood?.label] || "💭";
  const topics = (l.mind_map_nodes || []).sort((a,b) => b.weight - a.weight).slice(0, 12)
    .map(n => `<span class="topic${n.is_new ? " new" : ""}">${esc(n.topic)}</span>`).join("");
  const frictions = (l.friction_points || [])
    .map(f => `<li><b>${esc(f.type)}</b> — ${esc(f.description)}</li>`).join("");
  const recs = (l.recommendations || [])
    .map(r => `<li class="rec"><b>${esc(r.target)}</b>: ${esc(r.action)}<br><i style="color:var(--dim)">${esc(r.reason)}</i></li>`).join("");
  const loop =
    (l.acted_on_recommendations || []).map(a => `<li style="color:var(--aligned)">✓ ${esc(a)}</li>`).join("") +
    (l.ignored_recommendations || []).map(i => `<li style="color:var(--misaligned)">✗ ${esc(i)}</li>`).join("") +
    (l.friction_deltas || []).filter(d => d.status !== "new").map(d =>
      d.status === "persisting"
        ? `<li style="color:var(--friction)">↻ ${esc(d.description)} <span style="color:var(--dim);font-size:12px">· ${d.days_persisting || "?"}d</span></li>`
        : `<li style="color:var(--aligned)">✦ resolved — ${esc(d.description)}</li>`).join("");
  return `<div class="card" onclick="if(event.target.closest('.head')){this.classList.remove('open');this.classList.toggle('min')}else if(!event.target.closest('.detail')){this.classList.remove('min');this.classList.toggle('open')}">
    <div class="head">
      <span class="date">${esc(l.date)}</span>
      <span class="badge" style="background:${c}">${esc(l.alignment_label)} · ${pct}%</span>
    </div>
    <div class="question">💭 ${esc(l.your_question?.question)}</div>
    <div class="mood-line">${moodEmoji} <b>${esc(l.your_mood?.label)}</b> — ${esc((l.your_mood?.summary || "").slice(0, 120))}</div>
    ${insight ? `<div class="insight">✨ ${esc(insight)}</div>` : ""}
    <div class="detail">
      <h3>Topics</h3>${topics || "—"}
      <h3>Your mood</h3><p>${esc(l.your_mood?.summary)}</p>
      <h3>Agent mood</h3><p>${esc(l.agent_mood?.summary)}</p>
      <h3>Your open question</h3><p>${esc(l.your_question?.question)}</p>
      <h3>Friction</h3><ul>${frictions || "<li>none</li>"}</ul>
      ${loop ? `<h3>Learning loop</h3><ul style="list-style:none;padding-left:4px">${loop}</ul>` : ""}
      <h3>Recommendations</h3><ul>${recs || "<li>none</li>"}</ul>
      <h3>Briefing</h3>${briefParas(l.synthesis_context)}
    </div>
  </div>`;
}

async function trigger() {
  const date = document.getElementById("date").value;
  if (!date) return alert("Pick a date first");
  const res = await fetch("/api/trigger", { method:"POST", body: JSON.stringify({date}) });
  if (res.ok) load(); else alert("Trigger failed: " + (await res.text()));
}

document.getElementById("date").value = new Date().toLocaleDateString("sv");
load();
</script>
</body>
</html>
