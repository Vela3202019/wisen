<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>wisen · log in</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  form { max-width:340px; margin:18vh auto 0; padding:16px; display:flex; flex-direction:column; gap:10px; }
  h1 { font-size:20px; margin:0 0 8px; }
  input { background:var(--card); border:1px solid var(--border); color:var(--text);
          border-radius:8px; padding:10px; font-size:16px; }
  button { background:#238636; color:#fff; border:0; border-radius:8px; padding:10px; font-size:15px; }
  #error { color:var(--bad); font-size:13px; min-height:20px; }
</style>
</head>
<body>
<form id="login">
  <h1>wisen</h1>
  <input id="user" autocomplete="username" placeholder="user" required autocapitalize="none">
  <input id="password" type="password" autocomplete="current-password" placeholder="password" required>
  <button>Log in</button>
  <div id="error"></div>
</form>
<script>
document.getElementById("login").addEventListener("submit", async event => {
  event.preventDefault();
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: document.getElementById("user").value.trim(),
                           password: document.getElementById("password").value }),
  });
  if (res.ok) { location.replace("/" + location.hash); return; }
  const detail = (await res.json().catch(() => ({}))).detail;
  document.getElementById("error").textContent = typeof detail === "string" ? detail : "Log in failed";
});
</script>
</body>
</html>
