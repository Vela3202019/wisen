name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server,dev]"
      - run: ruff check .
      - run: python -m tests.test_claude_cli
      - run: python -m tests.test_fixtures
      - run: python -m tests.test_egress
      - run: python -m tests.test_store
      - run: python -m tests.test_jobs
