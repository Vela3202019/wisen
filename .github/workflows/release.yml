name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches every version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
          python - "$version" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          found = {
              "wisen/__init__.py": re.search(r'__version__ = "(.+)"', open("wisen/__init__.py").read())[1],
              "plugin/.claude-plugin/plugin.json": json.load(open("plugin/.claude-plugin/plugin.json"))["version"],
              ".claude-plugin/marketplace.json": json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"],
          }
          bad = {path: v for path, v in found.items() if v != version}
          for path, v in bad.items():
              print(f"::error::{path} has version {v}, pyproject has {version}")
          sys.exit(1 if bad else 0)
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wisen
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
