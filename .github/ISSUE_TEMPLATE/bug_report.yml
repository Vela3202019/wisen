name: Bug report
description: Something in wisen doesn't work the way the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem, or data leaving your machine when it shouldn't? Don't file it here; see [SECURITY.md](https://github.com/Vela3202019/wisen/blob/main/SECURITY.md).
        Please don't paste raw transcripts or API keys below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. wisen synthesize
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The traceback or log lines, with anything private removed.
      render: text
  - type: input
    id: version
    attributes:
      label: wisen version or commit
      placeholder: 0.1.0, or the output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version and model
      placeholder: macOS 15, Python 3.12, openai:gpt-5.6-terra
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connectors / ingestion
        - Synthesis (reflections)
        - Chat
        - Gardener
        - Server / dashboard
        - Claude Code plugin
        - CLI / install
        - Other
